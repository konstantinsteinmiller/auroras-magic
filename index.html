<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- YouTube Playables SDK - kept ONLY on the Playgama build, which IS the
       Playables submission (Playgama forwards that one archive to YouTube).
       Stripped everywhere else by vite.config.ts.

       Load-bearing twice over. YouTube's integration requirements say the SDK
       MUST load before any game code executes; and the Playgama Bridge's own
       `youtube` adapter polls for `window.ytgame` on a 100 ms interval with NO
       timeout, so without this tag `bridge.initialize()` never settles and
       Playables shows a blank screen with every other check green.

       IN <head>, AND FIRST, on purpose. Vite injects the entry bundle as a
       `<script type="module">` into the head at build time — so a tag placed
       down in <body> with the other portal SDKs loads AFTER the game's own
       code in document order, which is the thing the requirement forbids.
       A classic (non-module) script here is parser-blocking and modules are
       deferred regardless, so this is guaranteed to run first. -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <!-- Web Storage shim. MUST stay the first of OUR scripts and MUST stay a
       classic (non-module) tag: module scripts are deferred, so a shim installed
       from inside the module graph runs after the entry chunk's static imports.
       On YouTube Playables `window.localStorage` is NULL, and `main.ts` hands it
       straight to `new SaveManager(...)`, which binds its methods in the
       constructor — a blank screen before the splash clears. Ships on every
       build: sandboxed iframes and blocked-storage embeds fail the same way.
       Vite rewrites the path to `./js/storage-shim.js` under `--base=./`. -->
  <script src="/js/storage-shim.js"></script>
  <meta name="color-scheme" content="only light">
  <link rel="icon" href="/favicon.ico">
  <!-- The display face for everything BUT the title (which is inlined below,
       so it never waits for a network round trip). `crossorigin` is required
       even same-origin: without it the preload is discarded and the font is
       fetched a second time. -->
  <link rel="preload" href="/fonts/fredoka-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#9E7CBE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Auroras Magic">
  <meta name="description" content="Draw runes to duel a dark unicorn. Sketch fire, wind, ice and earth, stack three, and cast the combo before your rival lands hers.">
  <link rel="manifest" href="/manifest.json">
  <title>Auroras Magic</title>
  <style>
      /* ─── The title face, carried IN THIS FILE as bytes ─────────────────

         The game name is the string "Auroras Magic" in all 21 locales, so the
         title needs exactly eleven glyphs — 1.9 kB of Fredoka, 2.5 kB as
         base64. At that size it is cheaper to inline than to request, and
         inlining is the only way to be CERTAIN the title is painted in its
         own face the very first time it appears: a `<link>` font, however
         early and however preloaded, is still a network round trip, and the
         splash paints before it lands.

         That is the bug this fixes. The title used to be drawn in the system
         sans by this file and in `--am-font` (Arial-led) by FLogoProgress, so
         it visibly changed face a beat into every cold load.

         A FAMILY OF ITS OWN, not `AM Display`. Two @font-face rules sharing a
         family name and overlapping unicode-ranges resolve to the LAST one
         declared (CSS Fonts 4), so the file-backed face would win these
         glyphs back — and with `font-display: block` that means an invisible
         title until the file lands, which is worse than the swap we started
         with. Separate names, no contest.

         Fredoka, SIL Open Font License 1.1 — `public/fonts/OFL.txt`. */
      @font-face {
          font-family: 'AM Title';
          font-style: normal;
          font-weight: 600;
          font-display: block;
          src: url(data:font/woff2;base64,d09GMgABAAAAAAdUABAAAAAADPwAAAb6AAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGhYbgxwcLgZgP1NUQVRAAHwRCAqLNIhwCxoAATYCJAMwBCAFhEIHIAwHG4YKURTzgUwjZeH8/SAguqzqmVnhIh6pVYgHk39nD6J7ILc1MwdWbogRmehdGxHxk4vr92v1RKdrFKNBqDRCIeVjv+7bW8QfppaIRIYIiR+vIRYtQbNQKIkSOqu10RNTfBndKGLjwpuZCMCKIxWESeYSsV9SkYYozVu2705EiisnDTvaPvq/Qnq/HESyLysNI7OdYYU/0MOgQnPMFnU+cHJNYhAY9OWPQH4G+TJsFpi4NavoeAKTytosCIGTekqmzQI9gl13sxELGkI+QpWfdWmQ32w0As3DdQ4e/o80dPJtlZSGPMZZ8p18xzb5MwIdqtZqwHTV2EzDq5cGdBbsJvUYFhtZXM1hhcqEkEFhod6yT198C03eQidvhUOPMMlHOHXywn2Jl6c86vSwBJ87i6C7I4L0jXclC0OaEqn0viadSoHSG3Lt6kvEQKqK8jQG8jCmN4bytuNHsrO9PnZQmFz1mAxadar3+aJREeHlG2WLLgpfdUVeIEhBpa141/fxCTkCDn3vzUkQu9h5yKgi7HipNyN0sqjPC6mspG6MBqGR0ByC8wq+pjBN6IALD/Ekkk42ubS23OTIepN8LHfItXKWnCmnyalyghwnx2Jtl5gCuqXEoavPP4YBBpij90GptTdrErJyd1jtIf2laFq4VqWYs0axQGeAM9BZrlnlTjqb5rbprOkTpy4ovmFdxb69l6ypO2/R9MjkyZst/rkLg3v3svToUbBomtDlT19s8c8dG9zH3G/8+PkW/8KpaHlTFpi3fKLafcyEOeaCeeNCeip5Uxa4CjaJyDEbDpgLzp07J/LPnz9v8R/cGBwyabPlGNheqKd/83KRv2yTlQ1LyFu60bXfvXMXho2ZELSk5Lh58+bBFIt//vzQ8aiijKQ3jdlwwFVw7tA2kT95w31zF661+Ncvni7Uyac4febMmZ48rR49e5a8M2dOq5ybU9UEEwNnuqFQ2aCr7GWm//B2+yHbihI7D75nIkHjFy9eb/F/aGhoKAFSpknzCgsLSfPqm4sBTkss8xZXR5kKy0SOIH8PjFzbhpNa2Ng4iGocnezF+DgZZmBgAG6oQBfX0xWODpLm1f8CUn43DMANKyM9QMq+pTCGeOqVOTbWNQMC/wZI8xpLS3HofzUPD9OFjIVkSpgSmgJdLsO0fuVhkzxzJbMlUp1hZX6IZUKun95IqlL1wI9XxZQDxRQgghh6CENwgyFYmPH3qNe1MNWNcOz/dHoIGwZyg6FYGMKGg56/diW2MUg6zJXmzx0vMPQBmCaCecFvtixWaCEzHmUtyFZMFLJR0TDlEYIl+PMTidAo6MEdYQu63+/+YmotYGEtH2ViXetgZW5/BdjJBew4DFQEnZSUBB31le04+OHq7BzyEnzSQczJ3m1BUAkN60kHG2vHKgtNNpPakAM55T7dp7pzUFRmDUByyK1JU0FDQz06fqlMSemU6sSKZCs/ZKjkRUHQvCuIkeW10VSwZFc+FTRBKalzW4uKclspqZmgBAV2USo0NtJ67AHacuhvTKUYFhZMCzNzST4Lc1krEEMM37uBjgjXTxh6cEU6gG53kDwK645Ahn2iYKw7AuH+CTBQCztA+ur8TnJSPA7a2g5oSZ0IDc1IHUUBJz11Oy7hQgZ6dphjipSD7W2aHQLogHBi+N4ddESE3sPctzEkAyD+YRcLWe1y0gO1hzK9owud/XuN0zF/8AHHlUD3a644Ix+v+61YeMsLU3+qsfuVnfqBUTcclqNJ50sH/XO2a9cSVSo06VW0UUC1MtGmq7FhM37b9brJ8KBCP2wz255NDK02J+/53vKdUrshDRU7F6vXuHDvGmuDMu           unicode-range: U+20, U+41, U+4d, U+61, U+63, U+67, U+69, U+6f, U+72-73, U+75;
      }

      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from theme.sass - a custom property that has not
         resolved yet falls back to `initial`, which would flash white. Every
         value below is duplicated in FLogoProgress.vue and the two MUST stay
         identical: they hand over to each other when Vue mounts, and a
         mismatch is a visible flash on every cold load on every portal. */
      body {
          margin: 0;
          background-color: #9E7CBE;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 50% 42%, #A98BCE 0%, #7B5EA8 70%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      /* The same CARD FLogoProgress draws — the title, the mascot and the
         progress bar, at the same sizes, in the same order, with the
         same gaps — so nothing moves when Vue mounts and this element fades
         out. The two are on screen together for that 400 ms crossfade, and
         anything that differs between them is a visible jump on every cold
         load on every portal. Keep them in step. */
      .splash-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: min(1.1rem, 3vh);
          width: min(80vw, 420px);
      }

      .splash-title {
          /* The margin is the STROKE — see FLogoProgress.vue. */
          margin: 0.16em 0;
          /* IDENTICAL to FLogoProgress.vue's `.splash-title`, and it has to be:
             the two are on screen together through the crossfade. `AM Display`
             and the system stack are only reached if a locale ever gives the
             game a name outside those eleven glyphs. */
          font-family: 'AM Title', 'AM Display', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
          /* 600 is the weight the face ships; 900 would make the browser
             synthesise a bolder one by smearing it. */
          font-weight: 600;
          font-size: clamp(30px, 8vw, 56px);
          line-height: 1;
          color: #FFF6E6;
          -webkit-text-stroke: 0.28em #3A2340;
          paint-order: stroke fill;
          white-space: nowrap;
      }

      .splash-mascot {
          display: block;
          width: 100%;
          height: auto;
          max-height: 26vh;
          object-fit: contain;
      }

      /* The bar is drawn empty here and never fills: the real one is Vue's,
         which knows the progress. It is in this copy only so the card is the
         same HEIGHT in both, and the title does not jump up the screen the
         moment Vue mounts. Literals, not `--am-*` tokens, for the same reason
         as the colours above — theme.sass has not loaded yet. */
      .splash-bar {
          width: 100%;
          height: 14px;
          border: 4px solid #3A2340;
          border-radius: 999px;
          background: #3B2A54;
          box-sizing: content-box;
      }

      @media (max-height: 420px) {
          .splash-mascot { display: none; }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="splash-card">
    <h1 class="splash-title">Auroras Magic</h1>
    <!-- Painted through the art pipeline (art-sheets/PROMPTS-BRAND.md). The
         MARK is not here: with the title set in its own face the mark says the
         same thing twice, and two pictures over one progress bar is a crowded
         splash. It still ships — it is the app icon, the favicon and the cover
         art (`pnpm brand:icons`). Decorative, so its alt text is empty: the
         <h1> above already names the game. -->
    <img class="splash-mascot" src="/images/brand/mascot.webp" alt="" fetchpriority="high" decoding="async">
    <div class="splash-bar"></div>
  </div>
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- Playgama Bridge v2 is bundled from npm behind a build-gated dynamic import
     (src/utils/playgamaBridgeLoader.ts) — no script tag. -->
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<!-- Poki SDK - stripped for non-Poki builds by vite.config.ts -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
