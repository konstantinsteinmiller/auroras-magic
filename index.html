<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- YouTube Playables SDK - kept ONLY on the Playgama build, which IS the
       Playables submission (Playgama forwards that one archive to YouTube).
       Stripped everywhere else by vite.config.ts.

       Load-bearing twice over. YouTube's integration requirements say the SDK
       MUST load before any game code executes; and the Playgama Bridge's own
       `youtube` adapter polls for `window.ytgame` on a 100 ms interval with NO
       timeout, so without this tag `bridge.initialize()` never settles and
       Playables shows a blank screen with every other check green.

       IN <head>, AND FIRST, on purpose. Vite injects the entry bundle as a
       `<script type="module">` into the head at build time — so a tag placed
       down in <body> with the other portal SDKs loads AFTER the game's own
       code in document order, which is the thing the requirement forbids.
       A classic (non-module) script here is parser-blocking and modules are
       deferred regardless, so this is guaranteed to run first. -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <!-- Web Storage shim. MUST stay the first of OUR scripts and MUST stay a
       classic (non-module) tag: module scripts are deferred, so a shim installed
       from inside the module graph runs after the entry chunk's static imports.
       On YouTube Playables `window.localStorage` is NULL, and `main.ts` hands it
       straight to `new SaveManager(...)`, which binds its methods in the
       constructor — a blank screen before the splash clears. Ships on every
       build: sandboxed iframes and blocked-storage embeds fail the same way.
       Vite rewrites the path to `./js/storage-shim.js` under `--base=./`. -->
  <script src="/js/storage-shim.js"></script>
  <meta name="color-scheme" content="only light">
  <link rel="icon" href="/favicon.ico">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#9E7CBE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Auroras Magic">
  <meta name="description" content="Draw runes to duel a dark unicorn. Sketch fire, wind, ice and earth, stack three, and cast the combo before your rival lands hers.">
  <link rel="manifest" href="/manifest.json">
  <title>Auroras Magic</title>
  <style>
      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from theme.sass - a custom property that has not
         resolved yet falls back to `initial`, which would flash white. Every
         value below is duplicated in FLogoProgress.vue and the two MUST stay
         identical: they hand over to each other when Vue mounts, and a
         mismatch is a visible flash on every cold load on every portal. */
      body {
          margin: 0;
          background-color: #9E7CBE;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 50% 42%, #A98BCE 0%, #7B5EA8 70%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      /* The same CARD FLogoProgress draws — the mark, the title, the mascot
         and the progress bar, at the same sizes, in the same order, with the
         same gaps — so nothing moves when Vue mounts and this element fades
         out. The two are on screen together for that 400 ms crossfade, and
         anything that differs between them is a visible jump on every cold
         load on every portal. Keep them in step. */
      .splash-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: min(1.1rem, 3vh);
          width: min(80vw, 420px);
      }

      .splash-mark {
          display: block;
          width: min(34vw, 132px, 22vh);
          height: auto;
          aspect-ratio: 1;
          border-radius: 22%;
      }

      .splash-title {
          /* The margin is the STROKE — see FLogoProgress.vue. */
          margin: 0.16em 0;
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
          font-weight: 900;
          font-size: clamp(30px, 8vw, 56px);
          line-height: 1;
          color: #FFF6E6;
          -webkit-text-stroke: 0.28em #3A2340;
          paint-order: stroke fill;
          white-space: nowrap;
      }

      .splash-mascot {
          display: block;
          width: 100%;
          height: auto;
          max-height: 26vh;
          object-fit: contain;
      }

      /* The bar is drawn empty here and never fills: the real one is Vue's,
         which knows the progress. It is in this copy only so the card is the
         same HEIGHT in both, and the title does not jump up the screen the
         moment Vue mounts. Literals, not `--am-*` tokens, for the same reason
         as the colours above — theme.sass has not loaded yet. */
      .splash-bar {
          width: 100%;
          height: 14px;
          border: 4px solid #3A2340;
          border-radius: 999px;
          background: #3B2A54;
          box-sizing: content-box;
      }

      @media (max-height: 420px) {
          .splash-mascot { display: none; }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="splash-card">
    <!-- Painted through the art pipeline (art-sheets/PROMPTS-BRAND.md); they
         carry no lettering, so the title below is the only text and it is the
         player's own language. Both are decorative — the <h1> says the name —
         so their alt text is empty on purpose. -->
    <img class="splash-mark" src="/images/brand/logo.webp" alt="" fetchpriority="high" decoding="async">
    <h1 class="splash-title">Auroras Magic</h1>
    <img class="splash-mascot" src="/images/brand/mascot.webp" alt="" decoding="async">
    <div class="splash-bar"></div>
  </div>
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- Playgama Bridge v2 is bundled from npm behind a build-gated dynamic import
     (src/utils/playgamaBridgeLoader.ts) — no script tag. -->
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<!-- Poki SDK - stripped for non-Poki builds by vite.config.ts -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
